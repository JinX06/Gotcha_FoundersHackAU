<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <%- include('partials/navbar.html') %>

  <main class="max-w-6xl mx-auto px-4 py-20 text-center">
    <h2 class="text-4xl font-extrabold mb-4 text-gray-800">Welcome to Gotcha! 🎉</h2>
    <p class="text-lg text-gray-600 mb-8">
      Your one-stop platform to log in, submit, and manage tasks easily.
    </p>
    <div class="space-x-4">
      <a href="/login"
         class="inline-block px-6 py-3 bg-blue-600 text-white text-lg rounded-lg shadow hover:bg-blue-700 transition">
        Login
      </a>
      <a href="/signup"
         class="inline-block px-6 py-3 border border-blue-600 text-blue-600 text-lg rounded-lg shadow hover:bg-blue-50 transition">
        Sign Up
      </a>
    </div>
  </main>

  <footer class="max-w-6xl mx-auto px-4 py-6 text-center text-gray-500 text-sm">
    © <span id="year"></span> Gotcha!. All rights reserved.
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
